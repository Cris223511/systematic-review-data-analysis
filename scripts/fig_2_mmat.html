<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            padding: 20px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
        }

        canvas {
            max-height: 400px;
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <canvas id="riskChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('riskChart').getContext('2d');
        const data = {
            labels: [
                'Outcome data completeness',
                'Appropriateness of measurements',
                'Protocol and sampling strategy',
                'Sample representativeness',
                'Confounding control and analysis'
            ],
            datasets: [
                {
                    label: 'Yes',
                    data: [29, 29, 19, 19, 14],
                    backgroundColor: 'rgba(47, 72, 88, 0.90)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'Cannot tell',
                    data: [0, 0, 5, 6, 5],
                    backgroundColor: 'rgba(160, 174, 182, 0.90)',
                    borderColor: 'rgba(90, 105, 115, 1)',
                    borderWidth: 2
                },
                {
                    label: 'No',
                    data: [0, 0, 5, 4, 10],
                    backgroundColor: 'rgba(236, 240, 243, 0.95)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                }
            ]
        };
        const config = {
            type: 'bar',
            data: data,
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { size: 13, weight: 'bold' },
                            color: '#000000',
                            padding: 15,
                            usePointStyle: true,
                            boxWidth: 12
                        }
                    },
                    title: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        titleFont: { size: 13, weight: 'bold' },
                        bodyFont: { size: 13 },
                        callbacks: {
                            label: function (context) {
                                return context.dataset.label + ': ' + context.parsed.x + ' of 29';
                            }
                        }
                    },
                    datalabels: {
                        color: function (context) {
                            return context.datasetIndex === 0 ? '#ffffff' : '#000000';
                        },
                        font: { size: 12, weight: 'bold' },
                        formatter: function (value) {
                            return value > 0 ? value : '';
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        beginAtZero: true,
                        max: 29,
                        ticks: { stepSize: 5, font: { size: 13 } },
                        title: {
                            display: true,
                            text: 'Number of studies (n = 29 appraised)',
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    },
                    y: {
                        stacked: true,
                        ticks: { font: { size: 12, weight: 'bold' }, color: '#000000' },
                        grid: { display: false }
                    }
                },
                layout: {
                    padding: { left: 10, right: 20, top: 10, bottom: 10 }
                }
            },
            plugins: [ChartDataLabels]
        };
        new Chart(ctx, config);
    </script>
</body>

</html>
