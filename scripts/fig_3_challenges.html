<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            padding: 20px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
        }

        canvas {
            max-height: 420px;
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <canvas id="challengesChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('challengesChart').getContext('2d');
        const pct = [25.0, 12.5, 12.5, 12.5, 8.3];
        const data = {
            labels: [
                ['Classification uncertainty', 'and low predictive robustness'],
                ['Poor generalization', 'in small samples'],
                ['Multicollinearity in', 'multimodal data'],
                ['Class imbalance', 'and sampling biases'],
                ['Limited interpretability', 'of black-box models']
            ],
            datasets: [{
                label: 'Number of studies',
                data: [6, 3, 3, 3, 2],
                backgroundColor: 'rgba(47, 72, 88, 0.90)',
                borderColor: 'rgba(47, 72, 88, 1)',
                borderWidth: 2
            }]
        };
        const config = {
            type: 'bar',
            data: data,
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    title: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        titleFont: { size: 13, weight: 'bold' },
                        bodyFont: { size: 13 },
                        callbacks: {
                            label: function (context) {
                                return context.parsed.x + ' of 24 studies ('
                                    + pct[context.dataIndex].toFixed(1) + '%)';
                            }
                        }
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'end',
                        color: '#000',
                        font: { size: 13, weight: 'bold' },
                        formatter: function (value, context) {
                            return value + '  (' + pct[context.dataIndex].toFixed(1) + '%)';
                        }
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        max: 9,
                        ticks: { stepSize: 2, font: { size: 13 } },
                        title: {
                            display: true,
                            text: 'Number of studies (n = 24 eligible)',
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    },
                    y: {
                        ticks: { font: { size: 12, weight: 'bold' }, color: '#000000' },
                        grid: { display: false },
                        border: { display: false }
                    }
                },
                layout: {
                    padding: { left: 10, right: 70, top: 10, bottom: 10 }
                }
            },
            plugins: [ChartDataLabels]
        };
        new Chart(ctx, config);
    </script>
</body>

</html>
