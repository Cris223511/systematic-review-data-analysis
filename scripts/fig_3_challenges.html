<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            padding: 20px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
        }

        canvas {
            max-height: 420px;
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <canvas id="challengesChart"></canvas>
    </div>
    <script src="../pipeline/figure_data.js"></script>
    <script>
        const D = window.FIGURE_DATA;
        const ctx = document.getElementById('challengesChart').getContext('2d');
        const pct = D.challenges.map(c => c.pct);
        const LINES = {
            'Classification uncertainty and low predictive robustness': ['Classification uncertainty', 'and low predictive robustness'],
            'Poor generalization in small samples': ['Poor generalization', 'in small samples'],
            'Multicollinearity in multimodal data': ['Multicollinearity in', 'multimodal data'],
            'Class imbalance and sampling biases': ['Class imbalance', 'and sampling biases'],
            'Limited interpretability of black-box models': ['Limited interpretability', 'of black-box models']
        };
        const data = {
            labels: D.challenges.map(c => LINES[c.label]),
            datasets: [{
                label: 'Number of studies',
                data: D.challenges.map(c => c.n),
                backgroundColor: 'rgba(47, 72, 88, 0.90)',
                borderColor: 'rgba(47, 72, 88, 1)',
                borderWidth: 2
            }]
        };
        const config = {
            type: 'bar',
            data: data,
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    title: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        titleFont: { size: 13, weight: 'bold' },
                        bodyFont: { size: 13 },
                        callbacks: {
                            label: function (context) {
                                return context.parsed.x + ' of 21 studies ('
                                    + pct[context.dataIndex].toFixed(1) + '%)';
                            }
                        }
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'end',
                        color: '#000',
                        font: { size: 13, weight: 'bold' },
                        formatter: function (value, context) {
                            return value + '  (' + pct[context.dataIndex].toFixed(1) + '%)';
                        }
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        max: (m => m > 10 ? Math.ceil((m + 2) / 2) * 2 : m + 1)(Math.max(...D.challenges.map(c => c.n))),
                        ticks: { stepSize: Math.max(...D.challenges.map(c => c.n)) > 10 ? 2 : 1, font: { size: 13 } },
                        title: {
                            display: true,
                            text: `Number of studies (n = ${D.n_eligible} eligible)`,
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    },
                    y: {
                        ticks: { font: { size: 12, weight: 'bold' }, color: '#000000' },
                        grid: { display: false },
                        border: { display: false }
                    }
                },
                layout: {
                    padding: { left: 10, right: 70, top: 10, bottom: 10 }
                }
            },
            plugins: [ChartDataLabels]
        };
        new Chart(ctx, config);
    </script>
</body>

</html>
