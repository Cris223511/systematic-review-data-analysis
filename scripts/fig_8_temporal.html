<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 8</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            padding: 20px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
        }

        canvas {
            max-height: 430px;
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <canvas id="temporalChart"></canvas>
    </div>
    <script src="../pipeline/figure_data.js"></script>
    <script>
        const D = window.FIGURE_DATA;
        const ctx = document.getElementById('temporalChart').getContext('2d');
        const data = {
            labels: D.years,
            datasets: [
                {
                    label: 'CNN / Deep Learning',
                    data: D.temporal['CNN / Deep Learning'],
                    backgroundColor: 'rgba(47, 72, 88, 0.90)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'Traditional ML',
                    data: D.temporal['Traditional ML'],
                    backgroundColor: 'rgba(74, 108, 127, 0.90)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'Computer Vision pipelines',
                    data: D.temporal['Computer Vision pipelines'],
                    backgroundColor: 'rgba(126, 155, 170, 0.90)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'Other designs (clinical / conceptual)',
                    data: D.temporal['Other designs (clinical / conceptual)'],
                    backgroundColor: 'rgba(232, 182, 73, 0.90)',
                    borderColor: 'rgba(138, 106, 31, 1)',
                    borderWidth: 2
                }
            ]
        };
        const config = {
            type: 'bar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { size: 13, weight: 'bold' },
                            color: '#000000',
                            padding: 12,
                            usePointStyle: true,
                            boxWidth: 12
                        }
                    },
                    title: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 12,
                        titleFont: { size: 13, weight: 'bold' },
                        bodyFont: { size: 13 },
                        callbacks: {
                            footer: function (tooltipItems) {
                                let sum = 0;
                                tooltipItems.forEach(function (t) { sum += t.parsed.y; });
                                return 'Year total: ' + sum + ' studies';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        title: {
                            display: true,
                            text: 'Publication year',
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        ticks: {
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        grid: { display: false }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        max: Math.ceil((Math.max(...D.years.map((_, i) => Object.values(D.temporal).reduce((s, v) => s + v[i], 0))) + 1) / 2) * 2,
                        ticks: {
                            stepSize: 2,
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        title: {
                            display: true,
                            text: `Number of studies (n = ${D.n_eligible} eligible corpus)`,
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        grid: { color: 'rgba(0, 0, 0, 0.05)' }
                    }
                }
            }
        };
        new Chart(ctx, config);
    </script>
</body>

</html>
