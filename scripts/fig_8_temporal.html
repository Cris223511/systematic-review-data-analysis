<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 8</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            padding: 20px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
        }

        canvas {
            max-height: 430px;
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <canvas id="temporalChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('temporalChart').getContext('2d');

        const data = {
            labels: [
                '2018', '2019', '2020', '2021', '2022',
                '2023', '2024', '2025', '2026'
            ],
            datasets: [
                {
                    label: 'CNN / Deep Learning',
                    data: [0, 0, 0, 0, 1, 0, 3, 6, 0],
                    backgroundColor: 'rgba(47, 72, 88, 0.90)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'Traditional ML',
                    data: [0, 1, 0, 0, 0, 0, 2, 0, 0],
                    backgroundColor: 'rgba(74, 108, 127, 0.90)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'Computer Vision / Eye-tracking',
                    data: [1, 0, 0, 0, 0, 0, 0, 1, 0],
                    backgroundColor: 'rgba(126, 155, 170, 0.90)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'Multimodal / Wearable',
                    data: [1, 1, 0, 0, 0, 0, 0, 1, 1],
                    backgroundColor: 'rgba(201, 214, 222, 0.95)',
                    borderColor: 'rgba(47, 72, 88, 1)',
                    borderWidth: 2
                },
                {
                    label: 'No ML model (clinical / conceptual)',
                    data: [0, 2, 0, 2, 0, 0, 0, 1, 0],
                    backgroundColor: 'rgba(232, 182, 73, 0.90)',
                    borderColor: 'rgba(138, 106, 31, 1)',
                    borderWidth: 2
                }
            ]
        };

        const config = {
            type: 'bar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { size: 13, weight: 'bold' },
                            color: '#000000',
                            padding: 12,
                            usePointStyle: true,
                            boxWidth: 12
                        }
                    },
                    title: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 12,
                        titleFont: { size: 13, weight: 'bold' },
                        bodyFont: { size: 13 },
                        callbacks: {
                            footer: function (tooltipItems) {
                                let sum = 0;
                                tooltipItems.forEach(function (t) {
                                    sum += t.parsed.y;
                                });
                                return 'Year total: ' + sum + ' studies';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        title: {
                            display: true,
                            text: 'Publication year',
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        ticks: {
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        grid: { display: false }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        max: 11,
                        ticks: {
                            stepSize: 2,
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        title: {
                            display: true,
                            text: 'Number of studies (n = 24 eligible corpus)',
                            font: { size: 13, weight: 'bold' },
                            color: '#000000'
                        },
                        grid: { color: 'rgba(0, 0, 0, 0.05)' }
                    }
                }
            }
        };

        new Chart(ctx, config);
    </script>
</body>

</html>
